<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agarres y usuario ideal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
<style>/* Estilo sencillo tipo trabajo de clase: fondo blanco, un color de acento, fotos grandes */
:root{--bg:#ffffff;--ink:#222222;--muted:#666666;--line:#dddddd;--accent:#c4663f;--good:#2e8b57;--bad:#d23c3c;--soft:#f3f5f6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--ink:#eeeeee;--muted:#aaaaaa;--line:#3a3a3a;--accent:#e08060;--good:#5cc28a;--bad:#ef6b6b;--soft:#262a2c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b1b;--ink:#eeeeee;--muted:#aaaaaa;--line:#3a3a3a;--accent:#e08060;--good:#5cc28a;--bad:#ef6b6b;--soft:#262a2c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",Arial,sans-serif;padding:16px}
.deck{display:flex;flex-direction:column;align-items:center;gap:20px}
.frame{width:100%;max-width:1280px;aspect-ratio:16/9;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px}
.slide{position:absolute;inset:0 auto auto 0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);padding:64px 80px 56px;display:flex;flex-direction:column}
h1{font-size:60px;font-weight:800;margin:0;line-height:1.1;text-wrap:balance}
.sub{font-size:30px;color:var(--muted);margin:6px 0 0}
figure{margin:0}
.photo{display:block;width:100%;object-fit:cover;border-radius:12px;background:var(--soft)}

.grips{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:40px}
.card .photo{aspect-ratio:1/1}
.card .photo.product{object-fit:contain;background:#e2e7ea}
.card figcaption{padding-top:18px;font-size:25px;line-height:1.32}
.card b{font-size:31px;display:block}
.card p{margin:8px 0 0;color:var(--muted)}
.card.win .photo{outline:6px solid var(--good);outline-offset:-6px}
.card.win b{color:var(--good)}
.card{position:relative}
.best{position:absolute;top:20px;left:20px;z-index:1;font-style:normal;font-weight:800;font-size:20px;color:#fff;background:#2e8b57;border-radius:999px;padding:4px 14px}
.concl{font-size:32px;font-weight:700;margin:auto 0 10px}

.s2grid{display:grid;grid-template-columns:720px 1fr;gap:40px;margin:auto 0}
.family .photo{aspect-ratio:3/2}
.family ul{margin:22px 0 0;padding-left:28px;font-size:27px;line-height:1.38;display:flex;flex-direction:column;gap:10px}
.family li b{color:var(--accent)}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.need .photo{aspect-ratio:3/4}
.need figcaption{padding-top:16px;font-size:22px;line-height:1.32}
.need b{font-size:28px;display:block}
.need p{margin:8px 0 0;color:var(--muted)}
.need .sol{color:var(--ink);font-weight:700}
.salt{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:0 28px}
.salt div{display:flex;flex-direction:column}
.salt span{font-size:22px;color:var(--muted)}
.salt .big{font-size:84px;font-weight:800;line-height:1}
.salt .bad{color:var(--bad)}
.salt .ok{color:var(--good)}

@media print{@page{size:1920px 1080px;margin:0}body{padding:0}.deck{gap:0}.frame{width:1920px;height:1080px;max-width:none;border:0;border-radius:0;break-after:page}.slide{transform:none!important}}
</style></head><body><main class="deck">
<section class="frame"><div class="slide s1" id="s1">
 <h1>¿Qué agarre es mejor para la artritis?</h1><p class="sub">De los métodos convencionales a nuestro método.</p>
 <div class="grips"><figure class="card"><img class="photo" src="img/pulgar.jpg" alt=""><figcaption><b>Molinillo: girar con las dos manos</b><p>Girar duele en la base del pulgar (AAOS, s. f.), que carga 12 veces la fuerza aplicada (Cooney y Chao, 1977).</p></figcaption></figure><figure class="card"><img class="photo" src="img/hombro.jpg" alt=""><figcaption><b>Salero tradicional: sacudir</b><p>Mueve brazo y hombro una y otra vez, y no controla la dosis.</p></figcaption></figure><figure class="card"><img class="photo" src="img/muneca.jpg" alt=""><figcaption><b>Dispensador de bomba: empujar con la palma</b><p>Carga la muñeca doblada hacia atrás.</p></figcaption></figure><figure class="card win"><em class="best">Nuestro método</em><img class="photo product" src="img/producto.png" alt=""><figcaption><b>Dosis 5: apretar con 4 dedos</b><p>Reparte la fuerza: solo pide un 2–3 % de la fuerza de la mano (Mathiowetz et al., 1985).</p></figcaption></figure></div>
 <p class="concl">Conclusión: apretar con 4 dedos sosteniendo el salero es lo que menos duele. Por eso Dosis 5 funciona así.</p>
</div></section>
<section class="frame"><div class="slide s2" id="s2">
 <h1>Usuario ideal: una pareja recién casada que recibe a la familia</h1>
 <div class="s2grid"><figure class="family"><img class="photo" src="img/familia.jpg" alt=""><ul><li>En 2024 se casaron <b>568.395 parejas</b> en Turquía, con 26 a 28 años de media (TÜİK, 2025).</li><li>La familia se ve seguido: el <b>56,7 %</b> de los mayores de 60 recibe a sus hijos varias veces por semana (TÜİK, 2022).</li></ul></figure>
 <div class="needs"><figure class="need"><img class="photo" src="img/padres.jpg" alt=""><figcaption><b>Los padres: sin dolor</b><p>Casi la mitad de las personas con artritis tiene más de 65 años (Fallon et al., 2023).</p><p class="sol">→ Se aprieta con 4 dedos, sin girar.</p></figcaption></figure><figure class="need"><img class="photo" src="img/hermetico.jpg" alt=""><figcaption><b>Los niños: higiene</b><p>Los gérmenes pasan de las superficies a los dedos (Winther et al., 2007).</p><p class="sol">→ Hermético: nadie toca la sal.</p></figcaption></figure><figure class="need"><div class="photo salt"><div><span class="big bad">14,8 g</span><span>al día en Turquía</span></div><div><span class="big ok">5 g</span><span>máximo OMS</span></div></div><figcaption><b>Todos: la dosis</b><p>En Turquía se comen 14,8 g de sal al día y el 41 % se añade en casa (Erdem et al., 2017). La OMS pide menos de 5 g (WHO, 2012).</p><p class="sol">→ 0,5 g por presión: 10 presiones = máximo del día.</p></figcaption></figure></div></div>
</div></section>
</main><script>
function fit(){document.querySelectorAll('.frame').forEach(f=>{f.querySelector('.slide').style.transform='scale('+(f.clientWidth/1920)+')';});}
new ResizeObserver(fit).observe(document.body);fit();
</script></body></html>
